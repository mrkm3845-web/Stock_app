name: 作戦トリガー監視（日中・手動）

on:
  # 2026-11-15 効果測定により日中60分cronを停止（案C採用）:
  # - 2026-10-25以降の日中イベント発火0件、GitHub Actions遅延中央値約100分・発火率約6割
  # - 日中損切り・利確は証券会社のOCO注文を正とし、自動監視は引け後EOD（17:17 / 20:17 JST）に集約
  # - 日中に手動で確認したい場合のみ workflow_dispatch から実行する
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strategy-plan-intraday
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy yfinance

      - name: 作戦台帳をチェック
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python tools/check_strategy_plan.py --mode intraday

      - name: 状態変化があればコミット
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/strategy/events.json; then
            echo "状態変化なし（statusはコミットしない）"
            git checkout -- docs/strategy/status.json || true
          else
            git add docs/strategy/status.json docs/strategy/events.json
            git commit -m "Update strategy status [skip ci]"
            git pull --rebase -X theirs origin main || {
              echo "競合が発生したため、ローカル生成データを優先して解決します"
              GIT_EDITOR=true git rebase --continue
            }
            git push origin main
          fi
