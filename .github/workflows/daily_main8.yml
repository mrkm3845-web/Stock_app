name: 毎日スクリーニング main8（統合版）

on:
  schedule:
    # 平日 1日5回（夕方〜早朝）
    - cron: '17 8,10,12 * * 1-5'   # 17:17 / 19:17 / 21:17 JST
    - cron: '17 19,21 * * 1-5'     # 04:17 / 06:17 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas==3.0.5 numpy==2.4.6 requests==2.34.2 yfinance==1.7.0 openpyxl==3.1.5 xlrd==2.0.2

      - name: Cache price data
        uses: actions/cache@v4
        with:
          path: |
            data/price_cache
            data/stocks.db
          key: price-cache-${{ runner.os }}
          restore-keys: |
            price-cache-${{ runner.os }}-

      - name: Run main8 screener (technical)
        run: |
          python main8.py

      - name: コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/stocks.db
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "Update main8 screener data [skip ci]"
            git pull --rebase -X theirs origin main || {
              echo "競合が発生したため、ローカル生成データを優先して解決します"
              git checkout --theirs data/stocks.db || true
              git add data/stocks.db || true
              GIT_EDITOR=true git rebase --continue
            }
            git push origin main
          fi
