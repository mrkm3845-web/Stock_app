name: 毎日株価自動スクリーニング

on:
  schedule:
    - cron: '37 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ★ yfinanceを最新版(--upgrade)にし、Yahoo通信用のcurl_cffiを追加
      - name: ライブラリをインストール
        run: |
          pip install --upgrade yfinance requests pandas xlrd openpyxl numpy curl_cffi

      - name: 株価スクリーニングを実行
        env:
          TZ: 'Asia/Tokyo'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main3.py

      - name: 生成したHTMLをコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add docs/
          
          if git diff --staged --quiet; then
            echo ">> 変更はありませんでした。"
          else
            git commit -m "Update stock dashboard [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
