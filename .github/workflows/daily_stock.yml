name: 毎日株価自動スクリーニング

on:
  schedule:
    - cron: '34 9 * * 1-5'
    - cron: '34 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. プライム市場スキャン（マシンA）
  scan-prime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade yfinance requests pandas xlrd openpyxl numpy
      - run: python main4.py --market prime
      - uses: actions/upload-artifact@v4
        with:
          name: prime-data
          path: data/prime.json

  # 2. スタンダード市場スキャン（マシンB）
  scan-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade yfinance requests pandas xlrd openpyxl numpy
      - run: python main4.py --market standard
      - uses: actions/upload-artifact@v4
        with:
          name: standard-data
          path: data/standard.json

  # 3. 合体してHTML・SQLite保存＆Discord通知（マシンC）
  aggregate-and-publish:
    needs: [scan-prime, scan-standard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade yfinance pandas requests
      # ★ merge-multiple: true を追加してフォルダ直下にファイルを展開
      - uses: actions/download-artifact@v4
        with:
          path: data/
          merge-multiple: true
      - name: 合体＆通知＆保存
        env:
          TZ: 'Asia/Tokyo'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main4.py --aggregate
      - name: コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "Update stock data [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
