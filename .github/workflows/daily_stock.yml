name: 毎日株価自動スクリーニング

on:
  schedule:
    # 夕方・夜 17:17, 19:17, 21:17 (JST 月〜金)
    - cron: '17 8,10,12 * * 1-5'   # 17:17 JST (UTC 08:17)
    #- cron: '17 10 * * 1-5'  # 19:17 JST (UTC 10:17)
    #- cron: '17 12 * * 1-5'  # 21:17 JST (UTC 12:17)

    # 早朝 04:17, 06:17 (JST 火〜土の早朝 / UTC 前日)
    - cron: '17 19,21 * * 1-5'  # 04:17 JST (UTC 19:17 前日)
    #- cron: '17 21 * * 1-5'  # 06:17 JST (UTC 21:17 前日)

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-prime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade yfinance requests pandas xlrd openpyxl numpy
      - run: python main6.py --market prime
      - uses: actions/upload-artifact@v4
        with:
          name: prime-data
          path: data/prime.json

  scan-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade yfinance requests pandas xlrd openpyxl numpy
      - run: python main5.py --market standard
      - uses: actions/upload-artifact@v4
        with:
          name: standard-data
          path: data/standard.json

  aggregate-and-publish:
    needs: [scan-prime, scan-standard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade yfinance pandas requests
      - uses: actions/download-artifact@v4
        with:
          path: data/
          merge-multiple: true
      - name: 合体＆通知＆保存
        env:
          TZ: 'Asia/Tokyo'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main5.py --aggregate
      - name: コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "Update stock data (Incremental Merge) [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
