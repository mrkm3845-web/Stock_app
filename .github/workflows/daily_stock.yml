name: 毎日株価自動スクリーニング

on:
  schedule:
    # 1. 夕方 18:34 (UTC 09:34) - 当日確定値の第1便
    - cron: '34 9 * * 1-5'
    
    # 2. 夜 21:34 (UTC 12:34) - 超安定バックアップ（同日上書き補完）
    - cron: '34 12 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      # 1. コードのチェックアウト
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Pythonのセットアップ
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 必要なライブラリをインストール（最新版）
      - name: ライブラリをインストール
        run: |
          pip install --upgrade yfinance requests pandas xlrd openpyxl numpy curl_cffi

      # 4. スクリプトの実行（★ main4.py に変更）
      - name: 株価スクリーニングを実行
        env:
          TZ: 'Asia/Tokyo'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main4.py

      # 5. 生成したHTMLとSQLiteデータベースを自動コミット＆プッシュ（★ data/ を追加）
      - name: 結果(HTML・SQLite)をコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # docs/（HTML）と data/（SQLite DB）をコミット対象に追加
          git add docs/ data/
          
          if git diff --staged --quiet; then
            echo ">> 変更はありませんでした。"
          else
            git commit -m "Update stock dashboard & SQLite database [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
