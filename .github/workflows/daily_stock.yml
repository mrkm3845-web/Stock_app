name: 毎日株価自動スクリーニング

on:
  schedule:
    # 日本時間 (JST) 17:17, 19:17, 21:17 (月〜金)
    - cron: '17 8 * * 1-5'   # 17:17 JST (UTC 08:17)
    - cron: '17 10 * * 1-5'  # 19:17 JST (UTC 10:17)
    - cron: '17 12 * * 1-5'  # 21:17 JST (UTC 12:17)

    # 日本時間 (JST) 翌朝 05:07, 07:07 (火〜土の早朝)
    - cron: '7 20 * * 1-5'   # 05:07 JST (UTC 20:07 前日)
    - cron: '7 22 * * 1-5'   # 07:07 JST (UTC 22:07 前日)

  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. プライム市場スキャン（マシンA）
  scan-prime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade yfinance requests pandas xlrd openpyxl numpy
      - run: python main4.py --market prime
      - uses: actions/upload-artifact@v4
        with:
          name: prime-data
          path: data/prime.json

  # 2. スタンダード市場スキャン（マシンB）
  scan-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade yfinance requests pandas xlrd openpyxl numpy
      - run: python main4.py --market standard
      - uses: actions/upload-artifact@v4
        with:
          name: standard-data
          path: data/standard.json

  # 3. OR取り合体＆保存＆Discord通知（マシンC）
  aggregate-and-publish:
    needs: [scan-prime, scan-standard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade yfinance pandas requests
      - uses: actions/download-artifact@v4
        with:
          path: data/
          merge-multiple: true
      - name: 合体＆通知＆保存
        env:
          TZ: 'Asia/Tokyo'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main5.py --aggregate
      - name: コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "Update stock data (Incremental Merge) [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
