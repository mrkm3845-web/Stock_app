name: 毎日株価自動スクリーニング

on:
  schedule:
    # 協定世界時(UTC)で設定（日本時間の月〜金 17:37 に実行）
    # UTC 8:30 = JST 17:30
    - cron: '37 8 * * 1-5'
  
  # GitHubの画面から手動でポチッと実行できるようにする設定
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      # 1. コードをチェックアウト
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      # 2. Pythonのセットアップ
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 必要なライブラリをインストール
      - name: ライブラリをインストール
        run: |
          pip install yfinance pandas requests xlrd openpyxl numpy

      # 4. スクリプトの実行（ファイル名が main.py 以外の場合は書き換えてください）
      - name: 株価スクリーニングを実行
        run: |
          python main3.py
