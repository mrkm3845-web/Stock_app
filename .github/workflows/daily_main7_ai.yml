name: 毎朝 AI 戦略分析（main7 DeepSeek）

on:
  schedule:
    # 翌朝 06:17 JST（前日大引けデータ確定後）＝ UTC 21:17
    - cron: '17 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests yfinance openpyxl xlrd

      - name: Cache price data
        uses: actions/cache@v4
        with:
          path: data/price_cache
          key: price-cache-${{ runner.os }}-${{ hashFiles('main7.py') }}
          restore-keys: |
            price-cache-${{ runner.os }}-

      - name: Run main7 screener with DeepSeek analysis
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python main7.py --ai

      - name: コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "Update main7 AI analysis [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
