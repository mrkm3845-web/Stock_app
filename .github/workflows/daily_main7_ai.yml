name: 毎朝 AI 戦略分析（main7 DeepSeek）

on:
  schedule:
    # 当日夜 20:17 JST（大引け後・データ確定後）＝ UTC 11:17
    - cron: '17 11 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '既存の当日AI分析を上書きする'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas==3.0.5 numpy==2.5.3 requests==2.34.2 yfinance==1.7.0 openpyxl==3.1.5 xlrd==2.0.2

      - name: Cache price data
        uses: actions/cache@v4
        with:
          path: data/price_cache
          key: price-cache-${{ runner.os }}
          restore-keys: |
            price-cache-${{ runner.os }}-

      - name: Run main7 screener with DeepSeek analysis
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python main7.py --ai --force-ai
          else
            python main7.py --ai
          fi

      - name: コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "Update main7 AI analysis [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
