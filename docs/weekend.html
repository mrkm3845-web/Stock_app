<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d6efd">
    <meta name="description" content="起動したタイミングの相場観・作戦・リスク管理を、スマホで確認できるノートです。">
    <title>作戦ノート｜スイング戦略</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 0.9rem; padding-bottom: 60px; }
        .card { border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: none; margin-bottom: 15px; }
        .lead-card { background: linear-gradient(135deg, #eef6ff, #ffffff); border-left: 5px solid #0d6efd; }
        .section-body { font-size: 0.9rem; line-height: 1.7; }
        .section-body ul { padding-left: 1.2rem; }
        .section-body li { margin-bottom: 6px; }
        .section-body table { font-size: 0.82rem; }
        .section-body table th { background-color: #212529 !important; color: #fff !important; text-align: center; vertical-align: middle; white-space: nowrap; }
        .section-body table td { vertical-align: middle; }
        .pos { color: #d6336c; font-weight: 700; }
        .neg { color: #1971c2; font-weight: 700; }
        .plain { background: #f8f9fa; border-left: 4px solid #adb5bd; padding: 10px 12px; border-radius: 6px; margin: 8px 0; }
        .warn { background: #fff5f5; border-left: 4px solid #ff6b6b; padding: 10px 12px; border-radius: 6px; margin: 8px 0; }
        .toc-link { font-size: 0.78rem; }
        .badge-soft { background: #eef2f7; color: #495057; border: 1px solid #dee2e6; font-weight: 700; }
        .muted-small { font-size: 0.74rem; color: #868e96; }
        @media (max-width: 576px) {
            .section-body { font-size: 0.86rem; }
            .header-actions { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container py-3" style="max-width: 900px;">

    <div class="card p-3">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div>
                <h1 class="h5 mb-0 text-primary fw-bold"><i class="bi bi-journal-richtext"></i> 作戦ノート</h1>
                <small class="text-muted" id="page-subtitle">起動したタイミングの分析と、次の行動ルールをまとめるノートです。</small>
            </div>
            <div class="d-flex flex-wrap gap-2 header-actions justify-content-end">
                <a href="index.html" class="btn btn-outline-primary btn-sm fw-bold"><i class="bi bi-sliders me-1"></i> スクリーナー</a>
                <a href="strategy.html" class="btn btn-outline-danger btn-sm fw-bold"><i class="bi bi-signpost-split me-1"></i> 今日の作戦</a>
                <a href="weekly.html" class="btn btn-outline-success btn-sm fw-bold"><i class="bi bi-clipboard2-check me-1"></i> 週次答え合わせ</a>
                <a href="journal.html" class="btn btn-outline-primary btn-sm fw-bold"><i class="bi bi-journal-bookmark-fill me-1"></i> 取引記録</a>
                <a href="guide.html" class="btn btn-outline-secondary btn-sm fw-bold"><i class="bi bi-question-circle me-1"></i> 見方ガイド</a>
                <a href="ops.html" class="btn btn-outline-dark btn-sm fw-bold"><i class="bi bi-gear-wide-connected me-1"></i> 運用マニュアル</a>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
            <div class="input-group input-group-sm" style="width: auto;">
                <span class="input-group-text bg-light fw-bold"><i class="bi bi-calendar3 me-1"></i> ノート</span>
                <select id="note-selector" class="form-select form-select-sm fw-bold" aria-label="作戦ノートを選ぶ"></select>
            </div>
            <span id="updated-badge" class="badge badge-soft">更新: -</span>
            <span id="data-badge" class="badge badge-soft">データ: -</span>
            <span id="score-badge" class="badge badge-soft">スコア: -</span>
        </div>
    </div>

    <div id="loading" class="alert alert-info">読み込み中...</div>
    <div id="error-box" class="alert alert-warning d-none"></div>

    <div id="content" class="d-none">
        <div class="card p-3 lead-card">
            <h2 class="h6 fw-bold mb-2" id="note-title">作戦ノート</h2>
            <p class="mb-0" id="note-lead"></p>
            <div class="muted-small mt-2" id="note-meta"></div>
            <div class="muted-small mt-1">このノートは<b>作成時点の記録</b>です。最新の価格水準・保有は「今日の作戦」で確認してください。</div>
        </div>

        <div class="card p-3">
            <div class="fw-bold mb-2"><i class="bi bi-list-ul me-1"></i> 目次</div>
            <div id="toc" class="d-flex flex-wrap gap-2"></div>
        </div>

        <div id="sections"></div>
    </div>

    <div class="text-center muted-small mt-4">
        <p class="mb-1">このページは、その時点の分析と次の行動ルールを忘れないためのメモです。</p>
        <p class="mb-0">投資助言ではありません。データは作成時点のもので、最終判断はご自身でお願いします。</p>
    </div>
</div>

<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function fetchJson(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`${url} を読み込めませんでした（${res.status}）`);
    return res.json();
}

function setBadge(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
}

function renderNote(note, id) {
    const created = note.created_at || note.date || id;
    document.getElementById('note-title').textContent = note.title || '作戦ノート';
    document.getElementById('note-lead').textContent = note.lead || '';
    document.getElementById('note-meta').textContent = `${created} 作成 ／ データ基準 ${note.data_date || '-'}${note.trigger ? ' ／ ' + note.trigger : ''}`;
    document.getElementById('page-subtitle').textContent = note.subtitle || '起動したタイミングの分析と、次の行動ルールをまとめるノートです。';

    setBadge('updated-badge', `作成: ${created}`);
    setBadge('data-badge', `データ: ${note.data_date || '-'}`);
    setBadge('score-badge', `スコア: ${note.score_version || '-'}`);

    const sections = Array.isArray(note.sections) ? note.sections : [];
    document.getElementById('toc').innerHTML = sections
        .map(s => `<a href="#${esc(s.id)}" class="btn btn-outline-secondary btn-sm toc-link">${esc(s.title)}</a>`)
        .join('');

    document.getElementById('sections').innerHTML = sections
        .map(s => `<section class="card p-3" id="${esc(s.id)}">
            <h2 class="h6 fw-bold mb-2"><i class="bi bi-${esc(s.icon || 'dot')} me-1"></i>${esc(s.title)}</h2>
            <div class="section-body">${s.html || ''}</div>
        </section>`)
        .join('');
}

async function loadNote(id) {
    const box = document.getElementById('error-box');
    box.classList.add('d-none');
    try {
        const note = await fetchJson(`weekend/${id}.json`);
        renderNote(note, id);
        const url = new URL(location.href);
        url.searchParams.set('date', id);
        history.replaceState(null, '', url.pathname + url.search);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
        box.textContent = `ノートを読み込めませんでした：${err.message}`;
        box.classList.remove('d-none');
    }
}

async function boot() {
    try {
        const index = await fetchJson('weekend/index.json');
        const notes = (Array.isArray(index.notes) ? index.notes : [])
            .slice()
            .map(n => ({ ...n, _key: n.id || n.date, _created: n.created_at || n.date || n.id }))
            .sort((a, b) => String(b._created).localeCompare(String(a._created)));
        if (!notes.length) throw new Error('作戦ノートがまだありません。');

        const selector = document.getElementById('note-selector');
        selector.innerHTML = notes
            .map(n => `<option value="${esc(n._key)}">${esc(n._created)}　${esc(n.title || '')}</option>`)
            .join('');

        const params = new URLSearchParams(location.search);
        const requested = params.get('date') || params.get('id');
        const initial = notes.some(n => n._key === requested) ? requested : notes[0]._key;
        selector.value = initial;
        selector.addEventListener('change', () => loadNote(selector.value));

        await loadNote(initial);
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('content').classList.remove('d-none');
    } catch (err) {
        document.getElementById('loading').classList.add('d-none');
        const box = document.getElementById('error-box');
        box.textContent = `ページを準備できませんでした：${err.message}`;
        box.classList.remove('d-none');
    }
}

boot();
</script>
</body>
</html>
