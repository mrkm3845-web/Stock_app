<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>main7 スクリーナー（刷新版・AI分析付き）</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-size: 0.88rem; padding-bottom: 60px; }
        .card { border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: none; margin-bottom: 15px; }
        .table-container { overflow-x: auto; max-height: 65vh; }
        table th { background-color: #212529 !important; color: #fff !important; position: sticky; top: 0; z-index: 10; white-space: nowrap; text-align: center; font-size: 0.78rem; }
        table td { vertical-align: middle; white-space: nowrap; text-align: center; }
        .clickable { cursor: pointer; }
        .verdict-recommend { background-color: #d3f9d8; color: #2b8a3e; font-weight: bold; }
        .verdict-neutral { background-color: #e9ecef; color: #495057; font-weight: bold; }
        .verdict-avoid { background-color: #ffe3e3; color: #c92a2a; font-weight: bold; }
        .verdict-technical { background-color: #fff3bf; color: #d9480f; font-weight: bold; }
        .ai-section { border: 1px solid #dee2e6; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .ai-section h6 { font-size: 0.82rem; font-weight: bold; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div class="container-fluid py-3 px-md-4">
        <div class="card p-3 bg-white">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div>
                    <h1 class="h5 mb-0 text-primary fw-bold">main7 スクリーナー（刷新版・AI分析付き）</h1>
                    <small class="text-muted">Stage1 技術スコア → Stage2 DeepSeek 戦略提言</small>
                </div>
                <div class="d-flex gap-2">
                    <a href="index.html" class="btn btn-outline-secondary btn-sm fw-bold">main6 スクリーナー</a>
                    <a href="journal.html" class="btn btn-outline-primary btn-sm fw-bold">取引記録</a>
                </div>
            </div>
        </div>

        <!-- おすすめ銘柄 -->
        <div class="card p-3 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-bold text-dark">🔥 おすすめ銘柄（週 3〜5 銘柄・AI戦略提言付き）</span>
                <span class="text-muted small" id="rec-meta"></span>
            </div>
            <div class="table-container">
                <table class="table table-hover table-striped table-sm mb-0">
                    <thead>
                        <tr>
                            <th>コード</th><th>社名</th><th>業種</th><th>株価</th><th>スコア</th><th>AI判定</th><th>AI分析</th>
                        </tr>
                    </thead>
                    <tbody id="rec-body"></tbody>
                </table>
            </div>
        </div>

        <!-- 全候補一覧 -->
        <div class="card p-3 bg-white">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
                <span class="fw-bold text-dark">全候補一覧（Stage1 技術スコア順）</span>
                <div class="d-flex gap-2 align-items-center">
                    <span class="small">最低スコア:</span>
                    <input type="number" id="min-score" class="form-control form-control-sm" style="width:90px;" value="0" step="5" oninput="renderAll()">
                </div>
            </div>
            <div class="table-container">
                <table class="table table-hover table-striped table-sm mb-0">
                    <thead>
                        <tr>
                            <th>コード</th><th>社名</th><th>業種</th><th>株価</th><th>スコア</th>
                            <th>週足↑</th><th>GC</th><th>増加率</th><th>5日代金(千円)</th><th>価格帯</th><th>警告</th>
                        </tr>
                    </thead>
                    <tbody id="all-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- AI分析モーダル -->
    <div class="modal fade" id="aiModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white py-2">
                    <h6 class="modal-title" id="ai-title">AI戦略分析</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="ai-body"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let PICKS = [];
        let aiModal = null;

        async function loadJSON(path) {
            const res = await fetch(path);
            if (!res.ok) throw new Error(path + " not found");
            return await res.json();
        }

        async function init() {
            aiModal = new bootstrap.Modal(document.getElementById("aiModal"));
            let rec = null;
            try {
                rec = await loadJSON("recommendations.json");
            } catch (e) {
                try {
                    rec = await loadJSON("recommendations_technical.json");
                } catch (e2) {
                    rec = null;
                }
            }
            if (rec) {
                renderRecs(rec);
            } else {
                document.getElementById("rec-body").innerHTML =
                    '<tr><td colspan="7" class="p-3 text-muted">おすすめデータがまだありません（main7 実行後に生成されます）</td></tr>';
            }
            try {
                const all = await loadJSON("history7/latest.json");
                renderAll(all);
            } catch (e) {
                document.getElementById("all-body").innerHTML =
                    '<tr><td colspan="11" class="p-3 text-muted">候補データがまだありません</td></tr>';
            }
        }

        function verdictBadge(v) {
            const map = {
                recommend: "verdict-recommend", neutral: "verdict-neutral",
                avoid: "verdict-avoid", technical_only: "verdict-technical",
            };
            const label = {
                recommend: "推奨", neutral: "中立", avoid: "回避", technical_only: "技術のみ",
            }[v] || v;
            return `<span class="badge ${map[v] || "verdict-technical"}">${label}</span>`;
        }

        function renderRecs(rec) {
            document.getElementById("rec-meta").textContent =
                `更新: ${rec.generated_at || "-"} / 対象日: ${rec.date || "-"}`;
            PICKS = rec.picks || [];
            const body = document.getElementById("rec-body");
            if (PICKS.length === 0) {
                body.innerHTML = '<tr><td colspan="7" class="p-3 text-muted">おすすめ銘柄はありません</td></tr>';
                return;
            }
            body.innerHTML = PICKS.map(p => `<tr class="clickable" onclick="openAI('${p.code}')">
                <td>${p.code}</td>
                <td class="fw-bold text-start">${p.name}</td>
                <td>${p.sector}</td>
                <td>¥${(p.price || 0).toLocaleString()}</td>
                <td>${p.score}</td>
                <td>${verdictBadge(p.verdict)}</td>
                <td><button class="btn btn-outline-primary btn-sm py-0 px-2" onclick="event.stopPropagation(); openAI('${p.code}')">見る</button></td>
            </tr>`).join("");
        }

        function openAI(code) {
            const p = PICKS.find(x => x.code === code);
            if (!p) return;
            const adv = p.advice || {};
            const fund = p.fundamentals || {};

            const verdictLabel = { recommend: "推奨", neutral: "中立", avoid: "回避", technical_only: "技術スコアのみ" }[p.verdict] || p.verdict;

            document.getElementById("ai-title").innerHTML = `${p.code} ${p.name} ${verdictBadge(p.verdict)}`;

            const fundRows = [
                ["PER", fund.per != null ? fund.per + "倍" : "-"],
                ["PBR", fund.pbr != null ? fund.pbr + "倍" : "-"],
                ["ROE", fund.roe != null ? fund.roe + "%" : "-"],
                ["営業利益率", fund.op_margin != null ? fund.op_margin + "%" : "-"],
                ["配当利回り", fund.div_yield != null ? fund.div_yield + "%" : "-"],
            ].map(([k, v]) => `<div class="col-4 col-md-3"><small class="text-muted">${k}</small><div class="fw-bold">${v}</div></div>`).join("");

            document.getElementById("ai-body").innerHTML = `
                <div class="ai-section">
                    <h6 class="text-primary">基本情報</h6>
                    <div class="row g-2">
                        <div class="col-4 col-md-3"><small class="text-muted">業種</small><div class="fw-bold">${p.sector}</div></div>
                        <div class="col-4 col-md-3"><small class="text-muted">株価</small><div class="fw-bold">¥${(p.price || 0).toLocaleString()}</div></div>
                        <div class="col-4 col-md-3"><small class="text-muted">スコア</small><div class="fw-bold">${p.score}</div></div>
                        <div class="col-4 col-md-3"><small class="text-muted">価格帯</small><div class="fw-bold">${p.tier || "-"}</div></div>
                    </div>
                </div>

                <div class="ai-section">
                    <h6 class="text-success">AI 戦略提言（${verdictLabel}）</h6>
                    <div class="mb-2"><small class="text-muted">根拠</small><div>${escapeHtml(adv.reason || "-")}</div></div>
                    <div class="row g-2">
                        <div class="col-6"><small class="text-muted">エントリータイミング</small><div class="fw-bold">${escapeHtml(adv.entry_timing || "-")}</div></div>
                        <div class="col-3"><small class="text-muted">サポート</small><div class="fw-bold">${adv.support != null ? "¥" + Number(adv.support).toLocaleString() : "-"}</div></div>
                        <div class="col-3"><small class="text-muted">レジスタンス</small><div class="fw-bold">${adv.resistance != null ? "¥" + Number(adv.resistance).toLocaleString() : "-"}</div></div>
                    </div>
                    <div class="mt-2"><small class="text-muted">リスク注意</small><div>${escapeHtml(adv.risk || "-")}</div></div>
                </div>

                <div class="ai-section">
                    <h6 class="text-danger">売買計画</h6>
                    <div class="row g-2 text-center">
                        <div class="col-4"><small class="text-muted">利確目標</small><div class="fw-bold text-danger">${p.tp_price ? "¥" + p.tp_price.toLocaleString() : "-"}</div></div>
                        <div class="col-4"><small class="text-muted">損切ライン</small><div class="fw-bold text-primary">${p.sl_price ? "¥" + p.sl_price.toLocaleString() : "-"}</div></div>
                        <div class="col-4"><small class="text-muted">最長保有</small><div class="fw-bold">${p.max_hold_days || "-"}営業日</div></div>
                    </div>
                    <div class="mt-2"><small class="text-muted">警告</small><div>${(p.warnings || []).join(", ") || "なし"}</div></div>
                </div>

                <div class="ai-section">
                    <h6 class="text-secondary">ファンダメンタル（未検証層・参考）</h6>
                    <div class="row g-2">${fundRows}</div>
                </div>
            `;
            aiModal.show();
        }

        function escapeHtml(s) {
            return String(s)
                .split("<").join("<")
                .split(">").join(">");
        }

        let ALL = [];
        function renderAll(data) {
            if (Array.isArray(data)) ALL = data;
            const min = parseFloat(document.getElementById("min-score").value) || 0;
            const rows = ALL.filter(s => (s.score || 0) >= min)
                .sort((a, b) => (b.score || 0) - (a.score || 0));
            const body = document.getElementById("all-body");
            if (rows.length === 0) {
                body.innerHTML = '<tr><td colspan="11" class="p-3 text-muted">条件に一致する銘柄はありません</td></tr>';
                return;
            }
            body.innerHTML = rows.map(s => `<tr>
                <td>${s.code}</td>
                <td class="fw-bold text-start">${s.name}</td>
                <td>${s.sector}</td>
                <td>¥${(s.price || 0).toLocaleString()}</td>
                <td>${s.score}</td>
                <td>${s.weekly_trend_up ? "◯" : "-"}</td>
                <td>${s.gc_days === null ? "-" : s.gc_days + "日前"}</td>
                <td>${s.val_ratio_5d}倍</td>
                <td>${s.avg_val_5d}</td>
                <td>${s.tier}</td>
                <td>${(s.warnings || []).join(", ") || "-"}</td>
            </tr>`).join("");
        }

        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
