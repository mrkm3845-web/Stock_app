<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>main7 スクリーナー（刷新版・AI分析付き）</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-size: 0.88rem; padding-bottom: 60px; }
        .card { border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: none; margin-bottom: 15px; }
        .table-container { overflow-x: auto; max-height: 65vh; }
        table th { background-color: #212529 !important; color: #fff !important; position: sticky; top: 0; z-index: 10; white-space: nowrap; text-align: center; font-size: 0.76rem; }
        table td { vertical-align: middle; white-space: nowrap; text-align: center; }
        .clickable { cursor: pointer; }
        .verdict-recommend { background-color: #d3f9d8; color: #2b8a3e; font-weight: bold; }
        .verdict-neutral { background-color: #e9ecef; color: #495057; font-weight: bold; }
        .verdict-avoid { background-color: #ffe3e3; color: #c92a2a; font-weight: bold; }
        .verdict-technical { background-color: #fff3bf; color: #d9480f; font-weight: bold; }
        .ai-section { border: 1px solid #dee2e6; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .ai-section h6 { font-size: 0.82rem; font-weight: bold; margin-bottom: 6px; }
        .overall-box { background: #eef6ff; border-left: 4px solid #0d6efd; border-radius: 8px; padding: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container-fluid py-3 px-md-4">
        <div class="card p-3 bg-white">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div>
                    <h1 class="h5 mb-0 text-primary fw-bold">main7 スクリーナー（刷新版・AI分析付き）</h1>
                    <small class="text-muted">Stage1 技術スコア → Stage2 DeepSeek 戦略提言</small>
                </div>
                <div class="d-flex gap-2">
                    <a href="index.html" class="btn btn-outline-secondary btn-sm fw-bold">main6 スクリーナー</a>
                    <a href="journal.html" class="btn btn-outline-primary btn-sm fw-bold">取引記録</a>
                </div>
            </div>
        </div>

        <!-- AI総評 -->
        <div class="card p-3 bg-white" id="overall-card" style="display:none;">
            <span class="fw-bold text-dark">📊 AI総評（市場・テーマ）</span>
            <div class="overall-box mt-2" id="overall-text"></div>
        </div>

        <!-- おすすめ銘柄 -->
        <div class="card p-3 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-bold text-dark">🔥 おすすめ銘柄（AI順位・戦略提言付き）</span>
                <span class="text-muted small" id="rec-meta"></span>
            </div>
            <div class="table-container">
                <table class="table table-hover table-striped table-sm mb-0">
                    <thead>
                        <tr>
                            <th>順位</th><th>コード</th><th>社名</th><th>業種</th><th>株価</th><th>スコア</th><th>AI判定</th>
                            <th>エントリー</th><th>利確</th><th>損切</th><th>詳細</th>
                        </tr>
                    </thead>
                    <tbody id="rec-body"></tbody>
                </table>
            </div>
        </div>

        <!-- 全候補一覧 -->
        <div class="card p-3 bg-white">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
                <span class="fw-bold text-dark">全候補一覧（Stage1 技術スコア順）</span>
                <div class="d-flex gap-2 align-items-center">
                    <span class="small">最低スコア:</span>
                    <input type="number" id="min-score" class="form-control form-control-sm" style="width:90px;" value="0" step="5" oninput="renderAll()">
                </div>
            </div>
            <div class="table-container">
                <table class="table table-hover table-striped table-sm mb-0">
                    <thead>
                        <tr>
                            <th>コード</th><th>社名</th><th>業種</th><th>株価</th><th>スコア</th>
                            <th>週足↑</th><th>GC</th><th>増加率</th><th>5日代金(千円)</th><th>価格帯</th><th>警告</th>
                        </tr>
                    </thead>
                    <tbody id="all-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- AI分析モーダル -->
    <div class="modal fade" id="aiModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white py-2">
                    <h6 class="modal-title" id="ai-title">AI戦略分析</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="ai-body"></div>
                <div class="modal-footer justify-content-between py-2">
                    <span class="text-muted small" id="ai-updated"></span>
                    <button class="btn btn-outline-primary btn-sm fw-bold" onclick="copyPrompt()">
                        <i class="bi bi-clipboard me-1"></i> AI分析プロンプトをコピー
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let PICKS = [];
        let aiModal = null;
        let currentPick = null;

        async function loadJSON(path) {
            const res = await fetch(path);
            if (!res.ok) throw new Error(path + " not found");
            return await res.json();
        }

        async function init() {
            aiModal = new bootstrap.Modal(document.getElementById("aiModal"));

            const pickValid = (r) => r && r.picks && r.picks.length > 0;

            let aiRec = null;
            let techRec = null;
            try {
                aiRec = await loadJSON("recommendations.json");
            } catch (e) {
                aiRec = null;
            }
            try {
                techRec = await loadJSON("recommendations_technical.json");
            } catch (e) {
                techRec = null;
            }

            // 最新の取引日データを優先表示する（同日ならAI版を優先）
            let rec = null;
            if (pickValid(aiRec) && pickValid(techRec)) {
                rec = (String(aiRec.date || "") >= String(techRec.date || "")) ? aiRec : techRec;
            } else {
                rec = pickValid(aiRec) ? aiRec : (pickValid(techRec) ? techRec : null);
            }

            if (pickValid(rec)) {
                renderRecs(rec);
            } else {
                document.getElementById("rec-body").innerHTML =
                    '<tr><td colspan="11" class="p-3 text-muted">おすすめデータがまだありません（main7 実行後に生成されます）</td></tr>';
            }
            try {
                const all = await loadJSON("history7/latest.json");
                renderAll(all);
            } catch (e) {
                document.getElementById("all-body").innerHTML =
                    '<tr><td colspan="11" class="p-3 text-muted">候補データがまだありません</td></tr>';
            }
        }

        function verdictBadge(v) {
            const map = {
                recommend: "verdict-recommend", neutral: "verdict-neutral",
                avoid: "verdict-avoid", technical_only: "verdict-technical",
            };
            const label = {
                recommend: "推奨", neutral: "中立", avoid: "回避", technical_only: "技術のみ",
            }[v] || v;
            return '<span class="badge ' + (map[v] || "verdict-technical") + '">' + label + '</span>';
        }

        function yen(v) {
            if (v === null || v === undefined || v === "") return "-";
            return "¥" + Number(v).toLocaleString();
        }

        function renderRecs(rec) {
            document.getElementById("rec-meta").textContent =
                "更新: " + (rec.generated_at || "-") + " / 対象日: " + (rec.date || "-");
            PICKS = rec.picks || [];

            const overallCard = document.getElementById("overall-card");
            if (rec.overall) {
                overallCard.style.display = "";
                document.getElementById("overall-text").textContent = rec.overall;
            } else {
                overallCard.style.display = "none";
            }

            const body = document.getElementById("rec-body");
            if (PICKS.length === 0) {
                body.innerHTML = '<tr><td colspan="11" class="p-3 text-muted">おすすめ銘柄はありません</td></tr>';
                return;
            }
            body.innerHTML = PICKS.map(p => {
                const rank = p.rank != null ? p.rank : "-";
                const entry = p.entry_price != null ? yen(p.entry_price) : "-";
                return '<tr class="clickable" onclick="openAI(\'' + p.code + '\')">'
                    + '<td class="fw-bold">' + rank + '</td>'
                    + '<td>' + p.code + '</td>'
                    + '<td class="fw-bold text-start">' + esc(p.name) + '</td>'
                    + '<td>' + esc(p.sector) + '</td>'
                    + '<td>¥' + (p.price || 0).toLocaleString() + '</td>'
                    + '<td>' + p.score + '</td>'
                    + '<td>' + verdictBadge(p.verdict) + '</td>'
                    + '<td>' + entry + '</td>'
                    + '<td class="text-danger">' + yen(p.tp_price) + '</td>'
                    + '<td class="text-primary">' + yen(p.sl_price) + '</td>'
                    + '<td><button class="btn btn-outline-primary btn-sm py-0 px-2" onclick="event.stopPropagation(); openAI(\'' + p.code + '\')">見る</button></td>'
                    + '</tr>';
            }).join("");
        }

        function openAI(code) {
            const p = PICKS.find(x => x.code === code);
            if (!p) return;
            currentPick = p;
            const fund = p.fundamentals || {};

            document.getElementById("ai-title").innerHTML =
                p.code + " " + esc(p.name) + " " + verdictBadge(p.verdict);
            document.getElementById("ai-updated").textContent =
                p.rank != null ? ("AI順位 " + p.rank + " / 更新 " + (p.advice && p.advice.updated_at ? p.advice.updated_at : "-")) : "";

            const fundRows = [
                ["PER", fund.per != null ? fund.per + "倍" : "-"],
                ["PBR", fund.pbr != null ? fund.pbr + "倍" : "-"],
                ["ROE", fund.roe != null ? fund.roe + "%" : "-"],
                ["営業利益率", fund.op_margin != null ? fund.op_margin + "%" : "-"],
                ["配当利回り", fund.div_yield != null ? fund.div_yield + "%" : "-"],
            ].map(([k, v]) => '<div class="col-4 col-md-3"><small class="text-muted">' + k + '</small><div class="fw-bold">' + v + '</div></div>').join("");

            document.getElementById("ai-body").innerHTML =
                '<div class="ai-section">'
                + '<h6 class="text-primary">基本情報</h6>'
                + '<div class="row g-2">'
                + '<div class="col-4 col-md-3"><small class="text-muted">業種</small><div class="fw-bold">' + esc(p.sector) + '</div></div>'
                + '<div class="col-4 col-md-3"><small class="text-muted">株価</small><div class="fw-bold">¥' + (p.price || 0).toLocaleString() + '</div></div>'
                + '<div class="col-4 col-md-3"><small class="text-muted">スコア</small><div class="fw-bold">' + p.score + '</div></div>'
                + '<div class="col-4 col-md-3"><small class="text-muted">価格帯</small><div class="fw-bold">' + esc(p.tier || "-") + '</div></div>'
                + '</div></div>'

                + '<div class="ai-section">'
                + '<h6 class="text-success">AI 戦略提言</h6>'
                + '<div class="mb-2"><small class="text-muted">根拠</small><div>' + esc((p.advice && p.advice.reason) || "-") + '</div></div>'
                + '<div class="row g-2">'
                + '<div class="col-6"><small class="text-muted">エントリー戦略</small><div class="fw-bold">' + esc(p.entry_strategy || "-") + '</div></div>'
                + '<div class="col-6"><small class="text-muted">エントリー価格</small><div class="fw-bold">' + yen(p.entry_price) + '</div></div>'
                + '<div class="col-6"><small class="text-muted">サポート</small><div class="fw-bold">' + yen(p.support) + '</div></div>'
                + '<div class="col-6"><small class="text-muted">レジスタンス</small><div class="fw-bold">' + yen(p.resistance) + '</div></div>'
                + '</div></div>'

                + '<div class="ai-section">'
                + '<h6 class="text-danger">売買計画</h6>'
                + '<div class="row g-2 text-center">'
                + '<div class="col-4"><small class="text-muted">利確目標</small><div class="fw-bold text-danger">' + yen(p.tp_price) + '</div></div>'
                + '<div class="col-4"><small class="text-muted">損切ライン</small><div class="fw-bold text-primary">' + yen(p.sl_price) + '</div></div>'
                + '<div class="col-4"><small class="text-muted">最長保有</small><div class="fw-bold">' + (p.max_hold_days || "-") + '営業日</div></div>'
                + '</div>'
                + '<div class="mt-2"><small class="text-muted">トレーリング計画</small><div>' + esc(p.trailing_plan || "-") + '</div></div>'
                + '</div>'

                + '<div class="ai-section">'
                + '<h6 class="text-warning">直近の材料・ニュース（要確認）</h6>'
                + '<div>' + esc(p.news_note || "-") + '</div>'
                + '</div>'

                + '<div class="ai-section">'
                + '<h6 class="text-secondary">ファンダメンタル（未検証層・参考）</h6>'
                + '<div class="row g-2">' + fundRows + '</div>'
                + '</div>';

            aiModal.show();
        }

        function copyPrompt() {
            const p = currentPick;
            if (!p) return;
            const fund = p.fundamentals || {};
            const lines = [
                "以下の日本株について、スイングトレード（最大14営業日想定）の戦略を分析してください。",
                "",
                "【銘柄】" + p.code + " " + p.name + "（" + p.sector + "）",
                "【現在値】" + (p.price || 0) + "円 / スコア " + p.score,
                "【テクニカル】GC " + (p.gc_days === null ? "なし" : p.gc_days + "日前") + " / 出来高増加率 " + (p.val_ratio_5d || "-") + "倍 / 5日平均代金 " + (p.avg_val_5d || "-") + "千円 / ATR14 " + (p.atr14 || "-") + "円",
                "【ファンダメンタル】PER " + (fund.per != null ? fund.per + "倍" : "-") + " / PBR " + (fund.pbr != null ? fund.pbr + "倍" : "-") + " / ROE " + (fund.roe != null ? fund.roe + "%" : "-") + " / 配当 " + (fund.div_yield != null ? fund.div_yield + "%" : "-"),
                "【AI判定】" + (p.verdict || "-"),
                "",
                "以下を回答してください:",
                "1. 理想のエントリー戦略（押し目狙い / 上昇追い / 様子見）と具体的な価格",
                "2. 理想の利確目標・損切ライン・トレーリング計画",
                "3. 直近の材料・ニュース・リスク要因"
            ];
            const prompt = lines.join("\n");
            navigator.clipboard.writeText(prompt).then(() => {
                alert("📋 AI分析プロンプトをコピーしました。Gemini等に貼り付けてください。");
            }).catch(() => {
                alert("コピーに失敗しました。");
            });
        }

        function esc(s) {
            if (s === null || s === undefined) return "";
            return String(s).split("<").join("<").split(">").join(">");
        }

        let ALL = [];
        function renderAll(data) {
            if (Array.isArray(data)) ALL = data;
            const min = parseFloat(document.getElementById("min-score").value) || 0;
            const rows = ALL.filter(s => (s.score || 0) >= min)
                .sort((a, b) => (b.score || 0) - (a.score || 0));
            const body = document.getElementById("all-body");
            if (rows.length === 0) {
                body.innerHTML = '<tr><td colspan="11" class="p-3 text-muted">条件に一致する銘柄はありません</td></tr>';
                return;
            }
            body.innerHTML = rows.map(s => '<tr>'
                + '<td>' + s.code + '</td>'
                + '<td class="fw-bold text-start">' + esc(s.name) + '</td>'
                + '<td>' + esc(s.sector) + '</td>'
                + '<td>¥' + (s.price || 0).toLocaleString() + '</td>'
                + '<td>' + s.score + '</td>'
                + '<td>' + (s.weekly_trend_up ? "◯" : "-") + '</td>'
                + '<td>' + (s.gc_days === null ? "-" : s.gc_days + "日前") + '</td>'
                + '<td>' + s.val_ratio_5d + '倍</td>'
                + '<td>' + s.avg_val_5d + '</td>'
                + '<td>' + esc(s.tier) + '</td>'
                + '<td>' + (esc((s.warnings || []).join(", ")) || "-") + '</td>'
                + '</tr>').join("");
        }

        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
