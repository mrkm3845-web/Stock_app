<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>割安優良株＆スイング インタラクティブ・スクリーナー</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 0.88rem; padding-bottom: 60px; }
        .card { border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: none; margin-bottom: 15px; }
        .filter-label { font-size: 0.78rem; font-weight: 700; color: #495057; margin-bottom: 3px; }
        .btn-preset { font-size: 0.78rem; padding: 5px 12px; border-radius: 20px; transition: all 0.15s ease-in-out; }
        .btn-preset.active { box-shadow: 0 0 0 2px rgba(0,0,0,0.2) inset; font-weight: 700; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; max-height: 70vh; }
        table th { background-color: #212529 !important; color: #fff !important; position: sticky; top: 0; z-index: 10; white-space: nowrap; text-align: center; vertical-align: middle !important; font-size: 0.82rem; }
        table td { vertical-align: middle; white-space: nowrap; text-align: center; }
        
        .company-name {
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: left !important;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .company-name:hover { color: #0d6efd; }

        .col-mini { width: 36px !important; min-width: 36px !important; padding-left: 2px !important; padding-right: 2px !important; text-align: center; }
        .col-market { width: 44px !important; min-width: 44px !important; padding-left: 2px !important; padding-right: 2px !important; text-align: center; }

        .badge-mix { font-weight: 700; padding: 4px 7px; border-radius: 6px; }
        .mix-ultra { background-color: #ffe3e3; color: #d63301; }
        .mix-strict { background-color: #e6fcf5; color: #0ca678; }
        .rakuten-link { color: #bf0000; font-weight: 700; text-decoration: none; }
        .rakuten-link:hover { text-decoration: underline; color: #900000; }
        .badge-kabumini { font-size: 0.82rem; color: #d63301; font-weight: bold; }
        .badge-market { font-size: 0.72rem; padding: 2px 4px; font-weight: 600; }
        .badge-gc { font-size: 0.68rem; background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; border-radius: 4px; padding: 1px 3px; margin-left: 3px; font-weight: bold; }
        
        /* スイング戦略枠スタイル */
        .strategy-box { background: #f8f9fa; border-radius: 8px; border: 1px solid #dee2e6; padding: 10px; margin-bottom: 12px; }
        .strategy-item { font-size: 0.8rem; margin-bottom: 4px; }
        .strategy-desc { font-size: 0.72rem; color: #6c757d; margin-left: 18px; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container-fluid py-3 px-md-4 max-w-7xl">
        <!-- ヘッダー -->
        <div class="card p-3 bg-white">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <h1 class="h5 mb-0 text-primary fw-bold"><i class="bi bi-sliders"></i> 割安優良株＆スイング スクリーナー</h1>
                    <small class="text-muted">登録総数: <span id="total-count">-</span> 件</small>
                </div>
                <div class="d-flex flex-wrap gap-2 align-items-center ms-auto">
                    <div class="input-group input-group-sm" style="width: auto;">
                        <span class="input-group-text bg-light fw-bold"><i class="bi bi-calendar-event me-1"></i> 取得日</span>
                        <select id="date-selector" class="form-select form-select-sm fw-bold" onchange="loadDateData(this.value)"></select>
                    </div>
                    <div class="input-group input-group-sm" style="width: 180px;">
                        <input type="text" id="quick-search" class="form-control" placeholder="コード or 社名...">
                        <button class="btn btn-primary" onclick="searchStock()"><i class="bi bi-search"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- プリセットボタン -->
        <div class="card p-3 bg-white">
            <div class="filter-label mb-2"><i class="bi bi-lightning-charge-fill text-warning"></i> 絞り込みプリセット（重ねがけ可能）:</div>
            <div class="d-flex flex-wrap gap-2">
                <button id="btn-swing" class="btn btn-outline-danger btn-preset fw-bold" onclick="togglePreset('swing')">🚀 割安スイング (GC3日+出来高↑+割安)</button>
                <button id="btn-ultra" class="btn btn-outline-danger btn-preset" onclick="togglePreset('ultra')">🔥 超割安 (係数 < 5.625)</button>
                <button id="btn-strict" class="btn btn-outline-success btn-preset" onclick="togglePreset('strict')">🎯 厳選割安 (係数 < 11.25)</button>
                <button id="btn-graham" class="btn btn-outline-primary btn-preset" onclick="togglePreset('graham')">📋 グレアム標準 (係数 < 22.5)</button>
                <button id="btn-per15" class="btn btn-outline-secondary btn-preset" onclick="togglePreset('per15')">PER 15以下</button>
                <button id="btn-pbr15" class="btn btn-outline-secondary btn-preset" onclick="togglePreset('pbr15')">PBR 1.5以下</button>
                <button id="btn-highRoe" class="btn btn-outline-info btn-preset" onclick="togglePreset('highRoe')">💎 高ROE (10%↑)</button>
                <button id="btn-highDiv" class="btn btn-outline-warning btn-preset" onclick="togglePreset('highDiv')">💰 高配当 (利回り 3%↑)</button>
                <button class="btn btn-light btn-preset border text-muted ms-auto" onclick="resetAll()"><i class="bi bi-arrow-counterclockwise"></i> 全リセット</button>
            </div>
        </div>

        <!-- 詳細フィルタ -->
        <div class="card p-3 bg-white">
            <div class="row g-2 align-items-end">
                <div class="col-6 col-md-2">
                    <div class="filter-label">市場区分</div>
                    <select id="filter-market" class="form-select form-select-sm" onchange="applyFilters()">
                        <option value="ALL">全市場 (PRM / STD)</option>
                        <option value="プライム">プライム (PRM) のみ</option>
                        <option value="スタンダード">スタンダード (STD) のみ</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <div class="filter-label">かぶミニ (1株取引)</div>
                    <select id="filter-kabumini" class="form-select form-select-sm fw-bold text-danger" onchange="applyFilters()">
                        <option value="ALL">全て表示</option>
                        <option value="ONLY">1株OK (◯) 銘柄のみ</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <div class="filter-label">業種</div>
                    <select id="filter-sector" class="form-select form-select-sm" onchange="applyFilters()">
                        <option value="ALL">全業種</option>
                    </select>
                </div>

                <div class="col-6 col-md-2">
                    <div class="filter-label text-danger fw-bold">GC (ゴールデンクロス)</div>
                    <select id="filter-gc" class="form-select form-select-sm fw-bold border-danger" onchange="applyFilters()">
                        <option value="ALL">指定なし</option>
                        <option value="0">本日GC形成</option>
                        <option value="3">3営業日以内</option>
                        <option value="5">5営業日以内</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <div class="filter-label">5日平均売買代金 (最小 千円)</div>
                    <input type="number" id="filter-avgval" class="form-control form-control-sm" step="10000" placeholder="下限なし" oninput="applyFilters()">
                </div>
                <div class="col-6 col-md-2">
                    <div class="filter-label">売買代金増加率 (最小 倍)</div>
                    <input type="number" id="filter-valratio" class="form-control form-control-sm" step="0.5" placeholder="下限なし" oninput="applyFilters()">
                </div>

                <div class="col-6 col-md-2">
                    <div class="filter-label">ミックス係数 (最大)</div>
                    <input type="number" id="filter-mix" class="form-control form-control-sm" step="0.5" placeholder="上限なし" oninput="applyFilters()">
                </div>
                <div class="col-6 col-md-2">
                    <div class="filter-label">PER (最小 / 最大)</div>
                    <div class="input-group input-group-sm">
                        <input type="number" id="filter-per-min" class="form-control" step="0.5" value="4" placeholder="下限" oninput="applyFilters()">
                        <span class="input-group-text px-1">〜</span>
                        <input type="number" id="filter-per" class="form-control" step="1" placeholder="上限" oninput="applyFilters()">
                    </div>
                </div>
                <div class="col-6 col-md-2">
                    <div class="filter-label">PBR (最大)</div>
                    <input type="number" id="filter-pbr" class="form-control form-control-sm" step="0.1" placeholder="上限なし" oninput="applyFilters()">
                </div>

                <div class="col-6 col-md-2">
                    <div class="filter-label">並び替え順 (ソート)</div>
                    <select id="sort-by" class="form-select form-select-sm fw-bold text-primary" onchange="applyFilters()">
                        <option value="discount_desc">割安度(%) (降順)</option>
                        <option value="valratio_desc">売買代金増加率 (急増順 🚀)</option>
                        <option value="avgval_desc">5日平均売買代金 (流動性順)</option>
                        <option value="mix_asc">ミックス係数 (昇順/割安順)</option>
                        <option value="gc_asc">GC発生順 (最新順)</option>
                        <option value="roe_desc">ROE(%) (降順)</option>
                        <option value="margin_desc">営業利益率(%) (降順)</option>
                        <option value="div_desc">配当利回り(%) (降順)</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <div class="filter-label">割安度 (最小 %)</div>
                    <input type="number" id="filter-discount" class="form-control form-control-sm" step="5" placeholder="下限なし" oninput="applyFilters()">
                </div>
                <div class="col-6 col-md-2">
                    <div class="filter-label">ROE (最小 %)</div>
                    <input type="number" id="filter-roe" class="form-control form-control-sm" step="1" placeholder="下限なし" oninput="applyFilters()">
                </div>
            </div>
        </div>

        <!-- 結果一覧テーブル -->
        <div class="card p-3 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-bold text-dark">該当件数: <span id="filtered-count" class="text-primary fs-5">0</span> 件</span>
                <span class="text-muted small">💡 コード: 楽天証券 / 社名: 銘柄詳細</span>
            </div>
            <div class="table-container">
                <table class="table table-hover table-striped table-sm mb-0">
                    <thead>
                        <tr>
                            <th>順位</th>
                            <th>コード</th>
                            <th>社名</th>
                            <th class="col-mini">ミニ</th>
                            <th class="col-market">市場</th>
                            <th>業種</th>
                            <th>現在値</th>
                            <th>割安度</th>
                            <th>ミックス係数</th>
                            <th>利回り</th>
                            <th>PER</th>
                            <th>PBR</th>
                            <th>ROE</th>
                            <th>営業利益率</th>
                            <th>理論株価</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 銘柄詳細モーダル -->
    <div class="modal fade" id="stockModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="modalTitle">銘柄詳細</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody"></div>
                <div class="modal-footer justify-content-between">
                    <span id="modalMiniInfo" class="badge-kabumini"></span>
                    <div class="d-flex gap-2">
                        <!-- ★ Gemini相談ボタン -->
                        <button id="modalGeminiBtn" class="btn btn-outline-primary btn-sm fw-bold" onclick="consultGemini()">
                            <i class="bi bi-robot me-1"></i> Geminiで分析
                        </button>
                        <a id="modalRakutenBtn" href="#" target="_blank" class="btn btn-danger btn-sm fw-bold">
                            <i class="bi bi-box-arrow-up-right me-1"></i> 楽天証券
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let STOCKS = [];
        let modalInstance = null;
        let currentStockForAI = null;

        document.addEventListener("DOMContentLoaded", async () => {
            modalInstance = new bootstrap.Modal(document.getElementById('stockModal'));
            await initDates();
        });

        async function initDates() {
            try {
                const res = await fetch('history/dates.json');
                const dates = await res.json();
                const selector = document.getElementById('date-selector');
                selector.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');
                if (dates.length > 0) loadDateData(dates[0]);
            } catch (e) {
                loadDateData('latest');
            }
        }

        async function loadDateData(dateStr) {
            try {
                const url = dateStr === 'latest' ? 'history/latest.json' : `history/${dateStr}.json`;
                const res = await fetch(url);
                STOCKS = await res.json();
                document.getElementById("total-count").textContent = STOCKS.length;
                updateSectorOptions();
                togglePreset('graham');
            } catch (err) {
                console.error(err);
            }
        }

        function updateSectorOptions() {
            const sectors = [...new Set(STOCKS.map(s => s.sector))].filter(Boolean).sort();
            const sectorSelect = document.getElementById('filter-sector');
            sectorSelect.innerHTML = '<option value="ALL">全業種</option>' + sectors.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        function checkMini(s) {
            if (typeof s.is_mini !== 'undefined') return s.is_mini;
            return s.market === 'プライム' || (s.price >= 300 && s.price <= 50000);
        }

        function applyFilters() {
            const market = document.getElementById("filter-market").value;
            const kabumini = document.getElementById("filter-kabumini").value;
            const sector = document.getElementById("filter-sector").value;
            const gcFilter = document.getElementById("filter-gc").value;
            const minAvgVal = parseFloat(document.getElementById("filter-avgval").value);
            const minValRatio = parseFloat(document.getElementById("filter-valratio").value);
            const maxMix = parseFloat(document.getElementById("filter-mix").value);
            const minPer = parseFloat(document.getElementById("filter-per-min").value);
            const maxPer = parseFloat(document.getElementById("filter-per").value);
            const maxPbr = parseFloat(document.getElementById("filter-pbr").value);
            const minDiscount = parseFloat(document.getElementById("filter-discount").value);
            const minRoe = parseFloat(document.getElementById("filter-roe").value);
            const sortBy = document.getElementById("sort-by").value;

            let filtered = STOCKS.filter(s => {
                const isMini = checkMini(s);
                if (market !== "ALL" && s.market !== market) return false;
                if (kabumini === "ONLY" && !isMini) return false;
                if (sector !== "ALL" && s.sector !== sector) return false;
                
                if (gcFilter !== "ALL") {
                    const maxGcDays = parseInt(gcFilter, 10);
                    if (s.gc_days === null || typeof s.gc_days === 'undefined' || s.gc_days > maxGcDays) return false;
                }
                if (!isNaN(minAvgVal) && (s.avg_val_5d || 0) < minAvgVal) return false;
                if (!isNaN(minValRatio) && (s.val_ratio_5d || 0) < minValRatio) return false;

                if (!isNaN(maxMix) && s.mix_index > maxMix) return false;
                if (!isNaN(minPer) && s.per < minPer) return false;
                if (!isNaN(maxPer) && s.per > maxPer) return false;
                if (!isNaN(maxPbr) && s.pbr > maxPbr) return false;
                if (!isNaN(minDiscount) && s.discount_rate < minDiscount) return false;
                if (!isNaN(minRoe) && s.roe < minRoe) return false;
                return true;
            });

            filtered.sort((a, b) => {
                if (sortBy === "mix_asc") return a.mix_index - b.mix_index;
                if (sortBy === "discount_desc") return b.discount_rate - a.discount_rate;
                if (sortBy === "valratio_desc") return (b.val_ratio_5d || 0) - (a.val_ratio_5d || 0);
                if (sortBy === "avgval_desc") return (b.avg_val_5d || 0) - (a.avg_val_5d || 0);
                if (sortBy === "gc_asc") {
                    const ga = (a.gc_days !== null && typeof a.gc_days !== 'undefined') ? a.gc_days : 999;
                    const gb = (b.gc_days !== null && typeof b.gc_days !== 'undefined') ? b.gc_days : 999;
                    return ga - gb;
                }
                if (sortBy === "roe_desc") return b.roe - a.roe;
                if (sortBy === "margin_desc") return b.op_margin - a.op_margin;
                if (sortBy === "div_desc") return b.div_yield - a.div_yield;
                return 0;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            document.getElementById("filtered-count").textContent = data.length;
            const tbody = document.getElementById("stock-table-body");
            tbody.innerHTML = "";
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="15" class="p-4 text-muted text-center">条件に一致する銘柄はありません。</td></tr>';
                return;
            }
            let html = "";
            data.forEach((s, idx) => {
                let mixBadgeClass = s.mix_index < 5.625 ? "badge-mix mix-ultra" : (s.mix_index < 11.25 ? "badge-mix mix-strict" : "");
                const isMini = checkMini(s);
                const miniBadge = isMini ? `<span class="badge-kabumini" title="楽天証券で1株(かぶミニ)から購入可能">◯</span>` : `<span class="text-muted small">-</span>`;
                const rakutenUrl = `https://www.rakuten-sec.co.jp/web/market/search/quote.html?ric=${s.code}.T`;

                const isPrime = s.market === 'プライム';
                const marketBadge = `<span class="badge ${isPrime ? 'bg-primary' : 'bg-secondary'} badge-market" title="${s.market}市場">${isPrime ? 'PRM' : 'STD'}</span>`;
                
                const hasRecentGC = (s.gc_days !== null && typeof s.gc_days !== 'undefined' && s.gc_days <= 3);
                const gcBadge = hasRecentGC ? `<span class="badge-gc" title="${s.gc_days === 0 ? '本日' : s.gc_days + '日前'}にゴールデンクロス形成！">🚀GC</span>` : "";

                const isPositiveDiscount = s.discount_rate > 0;
                const discountClass = isPositiveDiscount ? "text-danger" : "text-primary";
                const discountText = `${isPositiveDiscount ? '+' : ''}${s.discount_rate}%`;

                html += `<tr>
                    <td><strong>${idx + 1}</strong></td>
                    <td><a href="${rakutenUrl}" target="_blank" class="rakuten-link" title="楽天証券を開く">${s.code} <i class="bi bi-box-arrow-up-right small"></i></a></td>
                    <td class="company-name" onclick="showStockDetail('${s.code}')" title="${s.name}（タップで詳細）">${s.name}${gcBadge}</td>
                    <td class="col-mini">${miniBadge}</td>
                    <td class="col-market">${marketBadge}</td>
                    <td class="text-muted small">${s.sector}</td>
                    <td>¥${s.price.toLocaleString()}</td>
                    <td class="${discountClass} fw-bold">${discountText}</td>
                    <td><span class="${mixBadgeClass}">${s.mix_index.toFixed(2)}</span></td>
                    <td class="fw-bold">${s.div_yield}%</td>
                    <td>${s.per.toFixed(1)}</td>
                    <td>${s.pbr.toFixed(2)}</td>
                    <td>${s.roe}%</td>
                    <td>${s.op_margin}%</td>
                    <td>¥${s.graham_price.toLocaleString()}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        function togglePreset(type) {
            const btnMap = {
                swing: document.getElementById("btn-swing"),
                ultra: document.getElementById("btn-ultra"),
                strict: document.getElementById("btn-strict"),
                graham: document.getElementById("btn-graham"),
                per15: document.getElementById("btn-per15"),
                pbr15: document.getElementById("btn-pbr15"),
                highRoe: document.getElementById("btn-highRoe"),
                highDiv: document.getElementById("btn-highDiv")
            };
            const currentBtn = btnMap[type];
            const isActive = currentBtn.classList.contains("active");

            if (type === 'swing') {
                if (!isActive) {
                    resetAll();
                    currentBtn.classList.add("active", "btn-danger");
                    currentBtn.classList.remove("btn-outline-danger");
                    document.getElementById("filter-gc").value = "3";
                    document.getElementById("filter-avgval").value = 50000;
                    document.getElementById("filter-valratio").value = 1.5;
                    document.getElementById("filter-discount").value = 0;
                    document.getElementById("sort-by").value = "discount_desc";
                } else {
                    resetAll();
                }
                applyFilters();
                return;
            }

            if (type === 'ultra' || type === 'strict' || type === 'graham') {
                ['ultra', 'strict', 'graham'].forEach(k => {
                    btnMap[k].classList.remove("active", "btn-danger", "btn-success", "btn-primary");
                    if (k === 'ultra') btnMap[k].classList.add("btn-outline-danger");
                    if (k === 'strict') btnMap[k].classList.add("btn-outline-success");
                    if (k === 'graham') btnMap[k].classList.add("btn-outline-primary");
                });
                if (!isActive) {
                    currentBtn.classList.add("active");
                    currentBtn.classList.remove("btn-outline-danger", "btn-outline-success", "btn-outline-primary");
                    if (type === 'ultra') { currentBtn.classList.add("btn-danger"); document.getElementById("filter-mix").value = 5.625; }
                    if (type === 'strict') { currentBtn.classList.add("btn-success"); document.getElementById("filter-mix").value = 11.25; }
                    if (type === 'graham') { currentBtn.classList.add("btn-primary"); document.getElementById("filter-mix").value = 22.5; }
                    if (!document.getElementById("filter-roe").value) document.getElementById("filter-roe").value = 7;
                } else {
                    document.getElementById("filter-mix").value = "";
                }
            }

            if (type === 'per15') {
                currentBtn.classList.toggle("active");
                currentBtn.classList.toggle("btn-secondary");
                currentBtn.classList.toggle("btn-outline-secondary");
                document.getElementById("filter-per").value = currentBtn.classList.contains("active") ? 15 : "";
            }
            if (type === 'pbr15') {
                currentBtn.classList.toggle("active");
                currentBtn.classList.toggle("btn-secondary");
                currentBtn.classList.toggle("btn-outline-secondary");
                document.getElementById("filter-pbr").value = currentBtn.classList.contains("active") ? 1.5 : "";
            }
            if (type === 'highRoe') {
                currentBtn.classList.toggle("active");
                currentBtn.classList.toggle("btn-info");
                currentBtn.classList.toggle("text-white");
                currentBtn.classList.toggle("btn-outline-info");
                document.getElementById("filter-roe").value = currentBtn.classList.contains("active") ? 10 : "";
            }
            if (type === 'highDiv') {
                currentBtn.classList.toggle("active");
                currentBtn.classList.toggle("btn-warning");
                currentBtn.classList.toggle("btn-outline-warning");
                document.getElementById("filter-div").value = currentBtn.classList.contains("active") ? 3.0 : "";
            }
            applyFilters();
        }

        function resetAll() {
            document.querySelectorAll(".btn-preset").forEach(btn => {
                btn.classList.remove("active", "btn-danger", "btn-success", "btn-primary", "btn-secondary", "btn-info", "btn-warning", "text-white");
            });
            document.getElementById("btn-swing").classList.add("btn-outline-danger");
            document.getElementById("btn-ultra").classList.add("btn-outline-danger");
            document.getElementById("btn-strict").classList.add("btn-outline-success");
            document.getElementById("btn-graham").classList.add("btn-outline-primary");
            document.getElementById("btn-per15").classList.add("btn-outline-secondary");
            document.getElementById("btn-pbr15").classList.add("btn-outline-secondary");
            document.getElementById("btn-highRoe").classList.add("btn-outline-info");
            document.getElementById("btn-highDiv").classList.add("btn-outline-warning");
            document.getElementById("filter-market").value = "ALL";
            document.getElementById("filter-kabumini").value = "ALL";
            document.getElementById("filter-sector").value = "ALL";
            document.getElementById("filter-gc").value = "ALL";
            document.getElementById("filter-avgval").value = "";
            document.getElementById("filter-valratio").value = "";
            document.getElementById("filter-mix").value = "";
            document.getElementById("filter-per-min").value = "4";
            document.getElementById("filter-per").value = "";
            document.getElementById("filter-pbr").value = "";
            document.getElementById("filter-discount").value = "";
            document.getElementById("filter-roe").value = "";
            document.getElementById("sort-by").value = "mix_asc";
            document.getElementById("quick-search").value = "";
            applyFilters();
        }

        function searchStock() {
            const q = document.getElementById("quick-search").value.trim().toLowerCase();
            if (!q) return;
            const target = STOCKS.find(s => s.code.toLowerCase() === q || s.name.toLowerCase().includes(q));
            if (target) showStockDetail(target.code);
            else alert("該当する銘柄が見つかりませんでした: " + q);
        }

        function showStockDetail(code) {
            const s = STOCKS.find(item => item.code === code);
            if (!s) return;
            currentStockForAI = s;
            const isMini = checkMini(s);
            const rakutenUrl = `https://www.rakuten-sec.co.jp/web/market/search/quote.html?ric=${s.code}.T`;

            let gcStr = "なし (未発生)";
            if (s.gc_days !== null && typeof s.gc_days !== 'undefined') {
                gcStr = s.gc_days === 0 ? "🔥 本日ゴールデンクロス！" : `🚀 ${s.gc_days}日前にGC形成`;
            }
            const avgValStr = s.avg_val_5d ? (s.avg_val_5d >= 100000 ? `¥${(s.avg_val_5d / 100000).toFixed(1)} 億円` : `¥${Math.round(s.avg_val_5d / 10).toLocaleString()} 万円`) : "-";
            const valRatioStr = s.val_ratio_5d ? `${s.val_ratio_5d} 倍` : "-";

            const isPositiveDiscount = s.discount_rate > 0;
            const discountClass = isPositiveDiscount ? "text-danger" : "text-primary";
            const discountText = `${isPositiveDiscount ? '+' : ''}${s.discount_rate}%`;

            // ★ スイング戦略の自動シミュレーション計算
            const p = s.price;
            const sma5 = s.sma5 || Math.round(p * 0.99);
            const sma25 = s.sma25 || Math.round(p * 0.96);
            const low5d = s.low_5d || Math.round(p * 0.97);
            const high20d = s.high_20d || Math.round(p * 1.08);

            // 1. 押し目買い目安（5日線付近〜現在値の98.5%）
            const entryLow = Math.min(sma5, Math.round(p * 0.985));
            const entryHigh = p;
            
            // 2. 損切りライン（25日線割れまたは直近5日安値割れ）
            const stopLoss = Math.min(Math.round(sma25 * 0.99), Math.round(low5d * 0.99));
            const stopLossPct = (((stopLoss - p) / p) * 100).toFixed(1);

            // 3. 利確ターゲット（直近20日高値または損切り幅の2倍リワード）
            const tpRiskReward = p + (p - stopLoss) * 2;
            const takeProfit = Math.max(high20d, Math.round(tpRiskReward));
            const takeProfitPct = (((takeProfit - p) / p) * 100).toFixed(1);

            document.getElementById("modalTitle").innerHTML = `<span class="badge bg-primary me-2">${s.code}</span> ${s.name}`;
            document.getElementById("modalBody").innerHTML = `
                <div class="row g-2 mb-2">
                    <div class="col-6"><small class="text-muted">市場 / 業種</small><div><strong>${s.market}</strong> (${s.sector})</div></div>
                    <div class="col-6"><small class="text-muted">現在株価</small><div class="fs-5 fw-bold text-primary">¥${p.toLocaleString()}</div></div>
                    <div class="col-6"><small class="text-muted">グレアム理論株価</small><div class="fs-5 fw-bold text-success">¥${s.graham_price.toLocaleString()}</div></div>
                    <div class="col-6"><small class="text-muted">理論株価との割安度</small><div class="fs-5 fw-bold ${discountClass}">${discountText}</div></div>
                </div>

                <!-- スイング・モメンタム指標 -->
                <div class="p-2 mb-2 bg-light rounded border">
                    <div class="fw-bold text-danger small mb-1"><i class="bi bi-graph-up-arrow"></i> モメンタム状態:</div>
                    <div class="row g-1 text-center">
                        <div class="col-4"><small class="text-muted" style="font-size:0.7rem;">GC状態</small><div class="fw-bold text-danger" style="font-size:0.78rem;">${gcStr}</div></div>
                        <div class="col-4"><small class="text-muted" style="font-size:0.7rem;">5日平均売買代金</small><div class="fw-bold" style="font-size:0.8rem;">${avgValStr}</div></div>
                        <div class="col-4"><small class="text-muted" style="font-size:0.7rem;">5日前比 出来高</small><div class="fw-bold text-primary" style="font-size:0.8rem;">${valRatioStr}</div></div>
                    </div>
                </div>

                <!-- ★ スイング戦略（押し目・損切・利確・根拠） -->
                <div class="strategy-box">
                    <div class="fw-bold text-dark small mb-2"><i class="bi bi-crosshair me-1 text-primary"></i> 🎯 スイング戦略シミュレーション (目安):</div>
                    
                    <div class="strategy-item text-success fw-bold">
                        <i class="bi bi-box-arrow-in-down-right me-1"></i> 押し目買い: ¥${entryLow.toLocaleString()} 〜 ¥${entryHigh.toLocaleString()}
                    </div>
                    <div class="strategy-desc">└ 【根拠】短期サポートの「5日移動平均線 (¥${sma5.toLocaleString()})」付近への押し目</div>

                    <div class="strategy-item text-danger fw-bold">
                        <i class="bi bi-shield-x me-1"></i> 損切りライン: ¥${stopLoss.toLocaleString()} (${stopLossPct}%)
                    </div>
                    <div class="strategy-desc">└ 【根拠】中期防衛線「25日線 (¥${sma25.toLocaleString()})」および直近5日安値割れで撤退</div>

                    <div class="strategy-item text-primary fw-bold">
                        <i class="bi bi-trophy me-1"></i> 利確目標: ¥${takeProfit.toLocaleString()} (+${takeProfitPct}%)
                    </div>
                    <div class="strategy-desc">└ 【根拠】直近20日高値 (¥${high20d.toLocaleString()}) / リスクリワード比 1:2 達成</div>
                </div>

                <div class="row g-2">
                    <div class="col-4 text-center p-2 border rounded"><small class="text-muted">ミックス係数</small><div class="fw-bold fs-6">${s.mix_index.toFixed(2)}</div></div>
                    <div class="col-4 text-center p-2 border rounded"><small class="text-muted">PER</small><div class="fw-bold fs-6">${s.per.toFixed(1)} 倍</div></div>
                    <div class="col-4 text-center p-2 border rounded"><small class="text-muted">PBR</small><div class="fw-bold fs-6">${s.pbr.toFixed(2)} 倍</div></div>
                    <div class="col-4 text-center p-2 border rounded"><small class="text-muted">ROE</small><div class="fw-bold fs-6">${s.roe} %</div></div>
                    <div class="col-4 text-center p-2 border rounded"><small class="text-muted">営業利益率</small><div class="fw-bold fs-6">${s.op_margin} %</div></div>
                    <div class="col-4 text-center p-2 border rounded"><small class="text-muted">配当利回り</small><div class="fw-bold fs-6 text-danger">${s.div_yield} %</div></div>
                </div>
            `;
            document.getElementById("modalMiniInfo").innerHTML = isMini ? `<i class="bi bi-check-circle-fill me-1 text-danger"></i> かぶミニ®(単元未満株 1株) 対応銘柄` : `<i class="bi bi-info-circle me-1"></i> 単元株(100株) 取引`;
            document.getElementById("modalRakutenBtn").href = rakutenUrl;
            modalInstance.show();
        }

        // ★ Gemini相談機能（プロンプト自動生成＆コピーしてGeminiを開く）
        function consultGemini() {
            if (!currentStockForAI) return;
            const s = currentStockForAI;
            const gcText = s.gc_days === 0 ? "本日GC形成" : (s.gc_days ? `${s.gc_days}日前にGC形成` : "GCなし");
            const valRatioText = s.val_ratio_5d ? `${s.val_ratio_5d}倍` : "通常";

            const prompt = `以下の日本株について、スイングトレード（保有期間数日〜数週間）の戦略を分析してください。

【銘柄情報】
・コード/社名: ${s.code} ${s.name} (${s.market} / ${s.sector})
・現在株価: ${s.price}円
・グレアム理論株価: ${s.graham_price}円 (割安度: ${s.discount_rate}%)
・ファンダメンタルズ: PER ${s.per}倍 / PBR ${s.pbr}倍 / ROE ${s.roe}% / 利回り ${s.div_yield}%
・テクニカル/出来高: ${gcText} / 出来高増加率: ${valRatioText}
・サポート/レジスタンス: 5日線 ${s.sma5 || '-'}円 / 25日線 ${s.sma25 || '-'}円 / 直近高値 ${s.high_20d || '-'}円

【回答してほしい内容】
1. チャート・需給面から見た買いタイミング（押し目買い価格の目安）
2. 撤退すべき損切りライン（下値支持線の根拠付き）
3. 利確ターゲット価格とリスクリワード評価
4. スイングトレードにおける注意点や好材料/リスク`;

            navigator.clipboard.writeText(prompt).then(() => {
                alert("📋 Geminiへの分析用プロンプトをクリップボードにコピーしました！\n開いたGeminiの入力欄に「貼り付け」して送信してください。");
                window.open("https://gemini.google.com/app", "_blank");
            }).catch(() => {
                window.open("https://gemini.google.com/app", "_blank");
            });
        }
    </script>
</body>
</html>
